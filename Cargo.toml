[package]
name = "gst-plugin-custom-compositor"
version = "0.1.0"
authors = ["Sebastian Dröge <sebastian@centricular.com>"]
license = "MIT"
edition = "2018"
description = "Custom Compositor Plugin"
repository = "https://gstreamer.freedesktop.org"

[dependencies]
libc = "0.2"
glib = { git = "https://github.com/gtk-rs/glib" }
glib-sys = { git = "https://github.com/gtk-rs/sys" }
gobject-sys = { git = "https://github.com/gtk-rs/sys" }
gstreamer = { git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs.git", features = ["v1_14"] }
gstreamer-base = { git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs.git", features = ["v1_16"], optional = true }
gstreamer-video = { git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs.git", features = ["v1_14"] }
gstreamer-sys = { git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs-sys.git" }
once_cell = "1.0"

[lib]
name = "gstcustomcompositor"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper = "0.1"
cc = "1.0"
pkg-config = "0.3"

[features]
default = []
#v1_18 = ["gstreamer/v1_18", "gstreamer-base"]
