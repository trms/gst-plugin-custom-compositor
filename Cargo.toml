[package]
name = "gst-plugin-custom-compositor"
version = "0.1.0"
authors = ["Sebastian Dröge <sebastian@centricular.com>"]
license = "MIT"
edition = "2018"
description = "Custom Compositor Plugin"
repository = "https://gstreamer.freedesktop.org"

[dependencies]
gst = { package = "gstreamer", version = "0.23", features = ["v1_24"] }
gst-base = { package = "gstreamer-base", version = "0.23", features = ["v1_24"] }
gst-video = { package = "gstreamer-video", version = "0.23", features = ["v1_24"] }
once_cell = "1.0"

[lib]
name = "gstcustomcompositor"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper = "0.2"
