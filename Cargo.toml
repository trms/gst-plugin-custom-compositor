[package]
name = "gst-plugin-custom-compositor"
version = "0.1.0"
authors = ["Sebastian Dröge <sebastian@centricular.com>"]
license = "MIT"
edition = "2018"
description = "Custom Compositor Plugin"
repository = "https://gstreamer.freedesktop.org"

[dependencies]
libc = "0.2"
glib = "0.10"
glib-sys = "0.10"
gobject-sys = "0.10"
gstreamer = { version = "0.16", features = ["v1_14"] }
gstreamer-base = { version = "0.16", features = ["v1_18"], optional = true }
gstreamer-video = { version = "0.16", features = ["v1_14"] }
gstreamer-sys = { version = "0.9" }
once_cell = "1.0"

[lib]
name = "gstcustomcompositor"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper = "0.2"
cc = "1.0"
pkg-config = "0.3"

[features]
default = []
v1_18 = ["gstreamer/v1_18", "gstreamer-base"]
